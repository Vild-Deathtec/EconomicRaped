<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Economic Raped</title>

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: #eaeaea;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
    }

    .container {
      display: flex;
      width: 100%;
    }

    /* Lado esquerdo */
    .left {
      width: 35%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .members {
      font-size: 22px;
      line-height: 1.9;
    }

    .members h2 {
      margin-bottom: 18px;
      font-size: 26px;
      letter-spacing: 2px;
    }

    /* Cada integrante */
    .member {
      display: block;
      transition: transform 0.25s ease, color 0.25s ease;
      cursor: default;
    }

    .member:hover {
      transform: scale(1.15);
      color: #e63946;
    }

    /* Centro */
    .center {
      width: 65%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .economic {
      font-size: 96px;
      font-weight: 300;
      letter-spacing: 6px;
      display: block;
    }

    .raped {
      font-size: 128px;
      font-weight: 900;
      letter-spacing: 8px;
      display: block;
      margin-top: -10px;
    }

    p {
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="left">
      <div class="members">
        <h2>Integrantes</h2>
        <span class="member">Ana — Vocal</span>
        <span class="member">Allison — Guitarra</span>
        <span class="member">Ciclano — Baixo</span>
        <span class="member">Taigo — Bateria</span>
      </div>
    </div>

    <div class="center">
      <div>
        <span class="economic">ECONOMIC</span>
        <span class="raped">RAPED</span>
      </div>
    </div>

  </div>
</body>
</html>
