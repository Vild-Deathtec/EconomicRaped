<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Economic Raped</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0d0d0d;
  --red: #e63946;
  --red-hover: #ff4d5a;
  --text: #eaeaea;
}

/* ===== MODO ALLISON ===== */
body.allison {
  --bg: #080000;
  --red: #8b0000;
  --red-hover: #8b0000;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  transition: background 0.8s ease;
}

/* ================= INTEGRANTES ================= */
.members {
  position: fixed;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 22px;
  line-height: 2;
  z-index: 10;
}

.members h2 {
  font-size: 26px;
  letter-spacing: 2px;
  margin-bottom: 20px;
  color: #fff;
}

.member {
  display: block;
  color: var(--red);
  cursor: pointer;
  transition: transform 0.25s ease, color 0.25s ease;
}

.member:hover {
  transform: scale(1.25);
  color: var(--red-hover);
}

/* ===== ALLISON ATIVO ===== */
.member.active {
  transform: scale(1.35);
  color: var(--red);
  pointer-events: none;
}

/* ================= CONTEÚDO ================= */
.content {
  max-width: 900px;
  margin: 0 auto;
  padding-top: 24px;
  padding-bottom: 300px;
}

/* ================= LOGO ================= */
.band-block {
  text-align: center;
  margin-bottom: 200px;
}

.band-block img {
  width: 420px;
  max-width: 92vw;
  display: block;
  margin: 0 auto;
  filter:
    drop-shadow(0 0 10px rgba(139,0,0,0.8))
    drop-shadow(0 0 30px rgba(139,0,0,0.6));
}

.tagline {
  margin-top: 14px;
  font-size: 14px;
  letter-spacing: 5px;
  color: var(--red);
  text-transform: uppercase;
  transition: color 0.6s ease;
}

.divider {
  width: 200px;
  height: 2px;
  background: var(--red);
  margin: 16px auto 0;
  transition: background 0.6s ease;
}

/* ================= TEXTO ================= */
.content p {
  font-size: 26px;
  line-height: 1.6;
  margin-bottom: 90px;
  text-align: center;
}

.content strong {
  color: var(--red);
}

.content .en {
  font-size: 22px;
  color: #bbb;
}
</style>
</head>

<body>

<!-- INTEGRANTES -->
<div class="members">
  <h2>Integrantes</h2>
  <span class="member">Ana — Vocal</span>
  <span class="member" id="allisonBtn">Allison — Guitarra</span>
  <span class="member">Ciclano — Baixo</span>
  <span class="member">Taigo — Bateria</span>
</div>

<!-- CONTEÚDO -->
<div class="content">

  <!-- LOGO -->
  <div class="band-block">
    <img src="Logobanda.png" alt="Economic Raped Logo">
    <div class="tagline" id="tagline">Metal Band</div>
    <div class="divider"></div>
  </div>

  <!-- TEXTO -->
  <div id="textBlock"></div>

</div>

<script>
const allisonBtn = document.getElementById("allisonBtn");
const textBlock = document.getElementById("textBlock");
const tagline = document.getElementById("tagline");

let allisonActive = false;

const bandText = `
<p>
  <strong>Economic Raped</strong> é uma banda de metal fundada em Santos/SP por
  <strong>Allison</strong> e <strong>Taigo</strong>, com o objetivo de unir a
  expressividade emocional do Emo à brutalidade e complexidade do
  <strong>metal extremamente técnico</strong>.
  <br><br>
  A formação atual conta com <strong>Ana</strong> (vocal),
  <strong>Allison</strong> (guitarra),
  <strong>Ciclano</strong> (baixo) e
  <strong>Taigo</strong> (bateria).
</p>

<p class="en">
  <strong>Economic Raped</strong> is a metal band founded in Santos, Brazil, by
  <strong>Allison</strong> and <strong>Taigo</strong>, blending emo-driven emotion
  with highly technical metal.
</p>
`;

const allisonText = `
<p>
  <strong>Allison</strong>, guitarrista da Economic Raped, é natural da capital de
  São Paulo e construiu sua identidade musical entre o
  <strong>neoclassicismo</strong> e o <strong>death metal técnico</strong>.
  <br><br>
  A banda surgiu da necessidade de unir tecnicidade extrema e expressão emocional,
  conectando a sofisticação do metal técnico à intensidade do Emo.
</p>

<p class="en">
  <strong>Allison</strong>, guitarist of Economic Raped, is from SP, Brazil, and
  developed his style through neoclassical influences and technical death metal,
  blending precision with emotional intensity.
</p>
`;

textBlock.innerHTML = bandText;

allisonBtn.addEventListener("click", () => {
  allisonActive = !allisonActive;

  if (allisonActive) {
    document.body.classList.add("allison");
    allisonBtn.classList.add("active");
    tagline.textContent = "Guitarrista";
    textBlock.innerHTML = allisonText;
  } else {
    document.body.classList.remove("allison");
    allisonBtn.classList.remove("active");
    tagline.textContent = "Metal Band";
    textBlock.innerHTML = bandText;
  }
});
</script>

</body>
</html>
