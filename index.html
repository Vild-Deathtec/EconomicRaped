<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Economic Raped</title>

<link rel="icon" type="image/png" href="Logobanda.png">

<style>
* { box-sizing: border-box; }

:root {
  --bg: #0d0d0d;
  --red: #e63946;
  --red-hover: #ff4d5a;
  --purple: #7a1fa2;
  --text: #eaeaea;
}

/* ===== MODO ALLISON ===== */
body.allison {
  --bg: #080000;
  --red: #8b0000;
  --red-hover: #8b0000;
}

/* ===== MODO TAIGO ===== */
body.taigo {
  --bg: #0b0012;
  --red: #7a1fa2;
  --red-hover: #7a1fa2;
}

/* ===== MODO MATEUS ===== */
body.mateus {
  --bg: #001a0d;
  --red: #1fa26a;
  --red-hover: #1fa26a;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  transition: background 0.8s ease;
}

/* ================= INTEGRANTES ================= */
.members {
  position: fixed;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 22px;
  line-height: 2;
  z-index: 10;
}

.members h2 {
  font-size: 26px;
  letter-spacing: 2px;
  margin-bottom: 20px;
  color: #fff;
}

.member {
  display: block;
  color: var(--red);
  cursor: pointer;
  transition: transform 0.25s ease, color 0.25s ease;
}

.member:hover {
  transform: scale(1.25);
  color: var(--red-hover);
}

.member.active {
  transform: scale(1.35);
  color: var(--red);
  pointer-events: none;
}

/* ================= CONTEÚDO ================= */
.content {
  max-width: 900px;
  margin: 0 auto;
  padding-top: 24px;
  padding-bottom: 300px;
}

/* ================= LOGO ================= */
.band-block {
  text-align: center;
  margin-bottom: 20px;
  cursor: pointer;
  position: relative;
  z-index: 5;
}

.band-block img {
  width: 420px;
  max-width: 92vw;
  display: block;
  margin: 0 auto;
  filter: drop-shadow(0 0 10px var(--red)) drop-shadow(0 0 30px var(--red));
  transition: filter 0.6s ease, opacity 0.6s ease;
}

.band-block:hover img {
  filter: drop-shadow(0 0 20px var(--red)) drop-shadow(0 0 40px var(--red));
}

.tagline {
  margin-top: 14px;
  font-size: 14px;
  letter-spacing: 5px;
  color: var(--red);
  text-transform: uppercase;
}

.divider {
  width: 200px;
  height: 2px;
  background: var(--red);
  margin: 16px auto 0;
}

/* ================= BOTÃO DISCOS ================= */
#discographyBtn {
  display: block;
  margin: 20px auto 40px;
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
  background: none;
  border: 1px solid var(--red);
  color: var(--red);
  transition: all 0.3s ease;
}

#discographyBtn:hover {
  background-color: var(--red);
  color: #fff;
  box-shadow: 0 0 20px var(--red), 0 0 40px var(--red);
}

/* ================= DISCOS ================= */
.discography-block {
  text-align: center;
  display: none;
  margin-bottom: 200px;
}

.discography-block img {
  width: 300px;
  max-width: 80vw;
  cursor: pointer;
  filter: drop-shadow(0 0 10px var(--red)) drop-shadow(0 0 30px var(--red));
  transition: filter 0.6s ease;
}

.discography-block img:hover {
  filter: drop-shadow(0 0 20px var(--red)) drop-shadow(0 0 40px var(--red));
}

/* ================= TEXTO ================= */
.content p {
  font-size: 26px;
  line-height: 1.6;
  margin-bottom: 90px;
  text-align: center;
}

.content strong {
  color: var(--red);
}

.content .en {
  font-size: 22px;
  color: #bbb;
}

/* ================= PLAYER VISUAL ================= */
.now-playing {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--red);
  padding: 14px 18px;
  width: 280px;
  font-size: 14px;
  letter-spacing: 1px;
  z-index: 999;
}

.now-playing span {
  display: block;
  color: var(--red);
  font-size: 11px;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.now-playing strong {
  color: #fff;
  font-weight: normal;
}

/* ===== RODAPÉ ===== */
.footer {
  text-align: center;
  padding: 40px 20px;
  color: var(--text);
  font-size: 18px;
  background: #111;
  margin-top: 50px;
}

.footer a {
  color: var(--red);
  text-decoration: none;
  transition: color 0.3s ease;
}

.footer a:hover {
  color: var(--red-hover);
}

.footer img {
  width: 40px;
  margin-top: 10px;
  cursor: pointer;
  filter: drop-shadow(0 0 10px var(--red)) drop-shadow(0 0 20px var(--red));
  transition: filter 0.6s ease;
}

.footer img:hover {
  filter: drop-shadow(0 0 15px var(--red)) drop-shadow(0 0 30px var(--red));
}
</style>
</head>

<body>

<div class="members">
  <h2>Integrantes</h2>
  <span class="member">Ana — Vocal</span>
  <span class="member" id="allisonBtn">Allison — Guitarra</span>
  <span class="member" id="mateusBtn">Mateus — Baixo</span>
  <span class="member" id="taigoBtn">Taigo — Bateria</span>
</div>

<div class="content">
  <div class="band-block" id="logoBtn">
    <img src="Logobanda.png" alt="Economic Raped Logo" id="bandLogo">
    <div class="tagline" id="tagline">Metal Band</div>
    <div class="divider"></div>
  </div>

  <button id="discographyBtn">Discografia</button>

  <div id="textBlock"></div>

  <div class="discography-block" id="discographyBlock">
    <a href="https://www.spotify.com/" target="_blank">
      <img src="CapaAlbum.jpg" alt="Capa do EP">
    </a>
  </div>
</div>

<div class="now-playing">
  <span>Tocando agora</span>
  <strong>Economic Raped — No One Is Ever Going to Want Me</strong>
</div>

<footer class="footer">
  <p>Contato: <a href="mailto:EconomicRapedband@gmail.com">EconomicRapedband@gmail.com</a></p>
  <a href="https://www.instagram.com/economicraped/" target="_blank">
    <img src="Instagramicon.png" alt="Instagram">
  </a>
  <a href="https://www.tiktok.com/@economicrapedband" target="_blank">
    <img src="Tiktokicon.png" alt="TikTok">
  </a>
</footer>

<script>
const allisonBtn = document.getElementById("allisonBtn");
const taigoBtn = document.getElementById("taigoBtn");
const mateusBtn = document.getElementById("mateusBtn");
const textBlock = document.getElementById("textBlock");
const tagline = document.getElementById("tagline");
const logoBtn = document.getElementById("logoBtn");
const bandLogo = document.getElementById("bandLogo");
const discographyBtn = document.getElementById("discographyBtn");
const discographyBlock = document.getElementById("discographyBlock");
const members = document.querySelector(".members");

const bandText = `
<p>
<strong>Economic Raped</strong> é uma banda de metal fundada em Santos/SP por <strong>Allison</strong> e <strong>Taigo</strong>, criada a partir da percepção de que não existia um espaço claro onde a <strong>técnica extrema</strong> e a <strong>complexidade musical</strong> pudessem coexistir com a <strong>expressividade emocional</strong> do Emo.
<br><br>
A proposta da banda é construir uma ponte real entre dois mundos que historicamente caminharam separados: o rigor técnico do <strong>metal extremamente técnico</strong> e a carga emocional crua, vulnerável e direta do Emo.
</p>

<p>
Musicalmente, a banda explora estruturas complexas, harmonias avançadas, grooves pesados e variações rítmicas, sem abrir mão de identidade, atmosfera e impacto emocional.
<br><br>
A formação atual conta com <strong>Ana</strong> (vocal), <strong>Allison</strong> (guitarra), <strong>Ciclano</strong> (baixo) e <strong>Taigo</strong> (bateria).
</p>

<p class="en">
<strong>Economic Raped</strong> is a metal band founded in Santos, Brazil, by <strong>Allison</strong> and <strong>Taigo</strong>, created from the need to connect extreme technicality with emotional expression.
<br><br>
The band bridges highly technical metal structures with the raw emotional intensity of emo.
</p>
`;

const allisonText = `
<p>
<strong>Allison</strong>, guitarrista da Economic Raped, é natural da capital de São Paulo e desenvolveu sua identidade musical a partir do <strong>neoclassicismo</strong> e do <strong>death metal técnico</strong>.
<br><br>
Sua abordagem combina domínio técnico, consciência harmônica e construção narrativa dentro do solo.
</p>

<p>
Entre suas principais influências estão <strong>Cacophony</strong>, <strong>First Fragment</strong> e <strong>Necrophagist</strong>.
</p>

<p class="en">
<strong>Allison</strong>, guitarist of Economic Raped, is from SP, Brazil.
</p>
`;

const taigoText = `
<p>
<strong>Taigo</strong>, baterista da Economic Raped, é natural de Santos/SP e construiu sua identidade musical a partir da combinação da <strong>emoção do Emo</strong> com o <strong>peso do metal</strong>.
</p>

<p>
Suas influências incluem <strong>My Chemical Romance</strong>, <strong>Pierce The Veil</strong>, <strong>MSI</strong> e <strong>Pantera</strong>.
</p>

<p class="en">
<strong>Taigo</strong>, drummer of Economic Raped, is from SP, Brazil.
</p>
`;

textBlock.innerHTML = bandText;

allisonBtn.onclick = () => {
  document.body.className = "allison";
  allisonBtn.classList.add("active");
  taigoBtn.classList.remove("active");
  mateusBtn.classList.remove("active");
  tagline.textContent = "Guitarra";
  bandLogo.src = "Logobanda.png";
  textBlock.style.display = "block";
  discographyBlock.style.display = "none";
  textBlock.innerHTML = allisonText;
};

taigoBtn.onclick = () => {
  document.body.className = "taigo";
  taigoBtn.classList.add("active");
  allisonBtn.classList.remove("active");
  mateusBtn.classList.remove("active");
  tagline.textContent = "Bateria";
  bandLogo.src = "Logobanda.png";
  textBlock.style.display = "block";
  discographyBlock.style.display = "none";
  textBlock.innerHTML = taigoText;
};

mateusBtn.onclick = () => {
  document.body.className = "mateus";
  mateusBtn.classList.add("active");
  allisonBtn.classList.remove("active");
  taigoBtn.classList.remove("active");
  tagline.textContent = "Baixo";
  bandLogo.src = "Logobanda.png";
  textBlock.style.display = "none";
  discographyBlock.style.display = "none";
};

logoBtn.onclick = () => {
  document.body.className = "";
  allisonBtn.classList.remove("active");
  taigoBtn.classList.remove("active");
  mateusBtn.classList.remove("active");
  tagline.textContent = "Metal Band";
  bandLogo.src = "Logobanda.png";
  textBlock.style.display = "block";
  discographyBlock.style.display = "none";
  textBlock.innerHTML = bandText;
};

discographyBtn.onclick = () => {
  textBlock.style.display = "none";
  discographyBlock.style.display = "block";
  bandLogo.src = "LogobandaBranca.png";
  allisonBtn.classList.remove("active");
  taigoBtn.classList.remove("active");
  mateusBtn.classList.remove("active");
};

if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
  document.body.classList.add("mobile");
  const content = document.querySelector(".content");
  content.parentNode.insertBefore(members, content.nextSibling);
  members.style.position = "static";
  members.style.transform = "none";
  members.style.margin = "20px auto";
  members.style.fontSize = "26px";
  members.style.maxHeight = "300px";
  members.style.overflowY = "auto";
  members.style.textAlign = "center";
  document.querySelectorAll(".member").forEach(member => {
    member.style.display = "block";
  });
}
</script>

</body>
</html>
