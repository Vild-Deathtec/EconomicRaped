<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Economic Raped</title>

<!-- FAVICON (MESMA LOGO) -->
<link rel="icon" type="image/png" href="Logobanda.png">

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0d0d0d;
  --red: #e63946;
  --red-hover: #ff4d5a;
  --text: #eaeaea;
  --highlight: var(--red);
}

/* ===== MODO ALLISON ===== */
body.allison {
  --bg: #080000;
  --red: #8b0000;
  --red-hover: #8b0000;
  --highlight: var(--red);
}

/* ===== MODO TAIGO ===== */
body.taigo {
  --bg: #0b0012;
  --red: #7a1fa2;
  --red-hover: #7a1fa2;
  --highlight: var(--red);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  transition: background 0.8s ease;
}

/* ================= INTEGRANTES ================= */
.members {
  position: fixed;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 22px;
  line-height: 2;
  z-index: 10;
}

.members h2 {
  font-size: 26px;
  letter-spacing: 2px;
  margin-bottom: 20px;
  color: #fff;
}

.member {
  display: block;
  color: var(--red);
  cursor: pointer;
  transition: transform 0.25s ease, color 0.25s ease;
}

.member:hover {
  transform: scale(1.25);
  color: var(--red-hover);
}

.member.active {
  transform: scale(1.35);
  color: var(--red);
  pointer-events: none;
}

/* ================= CONTEÚDO ================= */
.content {
  max-width: 900px;
  margin: 0 auto;
  padding-top: 24px;
  padding-bottom: 300px;
  text-align: center;
}

/* ================= LOGO ================= */
.band-block {
  cursor: pointer;
  margin-bottom: 20px;
}

.band-block img {
  width: 420px;
  max-width: 92vw;
  display: block;
  margin: 0 auto;
  filter:
    drop-shadow(0 0 10px var(--highlight))
    drop-shadow(0 0 30px var(--highlight));
  transition: filter 0.6s ease;
}

.tagline {
  margin-top: 14px;
  font-size: 14px;
  letter-spacing: 5px;
  color: var(--highlight);
  text-transform: uppercase;
}

.divider {
  width: 200px;
  height: 2px;
  background: var(--highlight);
  margin: 16px auto 0;
}

/* ================= BOTÃO DISCROGRAFIA ================= */
.band-actions {
  text-align: center;
  margin: 20px 0 40px;
}

#discographyBtn {
  background: none;
  border: 2px solid var(--highlight);
  color: var(--highlight);
  padding: 8px 20px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
}

#discographyBtn:hover {
  background: var(--highlight);
  color: var(--bg);
}

/* ================= DISCROGRAFIA ================= */
#discography {
  display: none;
  text-align: center;
  padding: 40px 20px;
}

.albums {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 30px;
}

.album-cover {
  width: 160px;
  max-width: 80vw;
  filter:
    drop-shadow(0 0 10px var(--highlight))
    drop-shadow(0 0 30px var(--highlight));
  transition: filter 0.3s ease, transform 0.3s ease;
  cursor: pointer;
}

.album-cover:hover {
  transform: scale(1.1);
  filter:
    drop-shadow(0 0 15px var(--highlight))
    drop-shadow(0 0 40px var(--highlight));
}

/* ================= TEXTO ================= */
.content p {
  font-size: 26px;
  line-height: 1.6;
  margin-bottom: 90px;
}

.content strong {
  color: var(--highlight);
}

.content .en {
  font-size: 22px;
  color: #bbb;
}

/* ================= PLAYER VISUAL ================= */
.now-playing {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--highlight);
  padding: 14px 18px;
  width: 280px;
  font-size: 14px;
  letter-spacing: 1px;
  z-index: 999;
}

.now-playing span {
  display: block;
  color: var(--highlight);
  font-size: 11px;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.now-playing strong {
  color: #fff;
  font-weight: normal;
}

/* ===== RODAPÉ ===== */
.footer {
  text-align: center;
  padding: 40px 20px;
  color: var(--text);
  font-size: 18px;
  background: #111;
  margin-top: 50px;
}

.footer a {
  color: var(--highlight);
  text-decoration: none;
  transition: color 0.3s ease;
}

.footer a:hover {
  color: var(--red-hover);
}

.footer img {
  width: 40px;
  height: 40px;
  margin-top: 10px;
  filter:
    drop-shadow(0 0 10px var(--highlight))
    drop-shadow(0 0 30px var(--highlight));
  transition: filter 0.3s ease, transform 0.3s ease;
  cursor: pointer;
}

.footer img:hover {
  transform: scale(1.1);
  filter:
    drop-shadow(0 0 15px var(--highlight))
    drop-shadow(0 0 40px var(--highlight));
}
</style>
</head>

<body>

<!-- INTEGRANTES -->
<div class="members">
  <h2>Integrantes</h2>
  <span class="member">Ana — Vocal</span>
  <span class="member" id="allisonBtn">Allison — Guitarra</span>
  <span class="member">Ciclano — Baixo</span>
  <span class="member" id="taigoBtn">Taigo — Bateria</span>
</div>

<!-- CONTEÚDO -->
<div class="content">

  <!-- LOGO -->
  <div class="band-block" id="logoBtn">
    <img src="Logobanda.png" alt="Economic Raped Logo">
    <div class="tagline" id="tagline">Metal Band</div>
    <div class="divider"></div>
  </div>

  <!-- BOTÃO DISCROGRAFIA -->
  <div class="band-actions">
    <button id="discographyBtn">Discografia</button>
  </div>

  <!-- TEXTO -->
  <div id="textBlock"></div>

  <!-- DISCROGRAFIA -->
  <div id="discography">
    <h2>Discografia</h2>
    <div class="albums">
      <a href="https://www.spotify.com/" target="_blank">
        <img src="CapaAlbum.jpg" class="album-cover" alt="EP 1">
      </a>
    </div>
  </div>

</div>

<!-- PLAYER VISUAL -->
<div class="now-playing">
  <span>Tocando agora</span>
  <strong>Economic Raped — No One Is Ever Going to Want Me</strong>
</div>

<!-- RODAPÉ COM EMAIL E INSTAGRAM -->
<footer class="footer">
  <p>Contato: <a href="mailto:EconomicRapedband@gmail.com">EconomicRapedband@gmail.com</a></p>
  <a href="https://www.instagram.com/economicraped/" target="_blank">
    <img src="Instagramicon.png" alt="Instagram">
  </a>
</footer>

<script>
const allisonBtn = document.getElementById("allisonBtn");
const taigoBtn = document.getElementById("taigoBtn");
const textBlock = document.getElementById("textBlock");
const tagline = document.getElementById("tagline");
const logoBtn = document.getElementById("logoBtn");
const discographyBtn = document.getElementById("discographyBtn");
const discographyDiv = document.getElementById("discography");

let mode = "band";

const bandText = `
<p>
 <strong>Economic Raped</strong> é uma banda de metal fundada em Santos/SP por
  <strong>Allison</strong> e <strong>Taigo</strong>, criada a partir da percepção de
  que não existia um espaço claro onde a <strong>técnica extrema</strong> e a
  <strong>complexidade musical</strong> pudessem coexistir com a
  <strong>expressividade emocional</strong> do Emo.
  <br><br>
  A proposta da banda é construir uma ponte real entre dois mundos que
  historicamente caminharam separados: o rigor técnico do
  <strong>metal extremamente técnico</strong> e a carga emocional crua,
  vulnerável e direta do Emo.
</p>

<p>
  Musicalmente, a banda explora estruturas complexas, harmonias avançadas,
  grooves pesados e variações rítmicas, sem abrir mão de identidade,
  atmosfera e impacto emocional.
  <br><br>
  A formação atual conta com <strong>Ana</strong> (vocal),
  <strong>Allison</strong> (guitarra),
  <strong>Ciclano</strong> (baixo) e
  <strong>Taigo</strong> (bateria).
</p>

<p class="en">
  <strong>Economic Raped</strong> is a metal band founded in Santos, Brazil, by
  <strong>Allison</strong> and <strong>Taigo</strong>, created from the need to
  connect extreme technicality with emotional expression.
  <br><br>
  The band bridges highly technical metal structures with the raw emotional
  intensity of emo, merging complexity, groove, and feeling into a single
  musical identity.
</p>
`;

const allisonText = `
<p>
  <strong>Allison</strong>, guitarrista da Economic Raped, é natural da capital de
  São Paulo e desenvolveu sua identidade musical a partir do
  <strong>neoclassicismo</strong> e do <strong>death metal técnico</strong>.
  <br><br>
  Sua abordagem combina domínio técnico, consciência harmônica e construção
  narrativa dentro do solo, buscando não apenas velocidade ou complexidade,
  mas <strong>direção musical e expressão</strong>.
</p>

<p>
  Entre suas principais influências estão <strong>Cacophony</strong>,
  <strong>First Fragment</strong> e <strong>Necrophagist</strong>, referências que
  moldaram sua visão sobre técnica aplicada à composição, e não apenas como
  demonstração de habilidade.
  <br><br>
  A criação da banda, ao lado de Taigo, surgiu da necessidade de estabelecer
  um meio termo real entre a sofisticação técnica do metal extremo e a
  <strong>emoção direta e humana</strong> presente no Emo.
</p>

<p class="en">
  <strong>Allison</strong>, guitarist of Economic Raped, is from SP, Brazil.
  His style is rooted in neoclassical guitar and technical death metal,
  focusing on musical direction, harmonic awareness, and emotional intent
  rather than pure technical display.
</p>
`;

const taigoText = `
<p>
  <strong>Taigo</strong>, baterista da Economic Raped, é natural de Santos/SP e
  construiu sua identidade musical a partir de uma combinação pouco comum:
  a <strong>emoção do Emo</strong> com o <strong>peso e groove</strong> do metal.
  <br><br>
  Suas principais influências incluem <strong>My Chemical Romance</strong>,
  <strong>Pierce The Veil</strong>, <strong>MSI</strong> e o groove massivo do
  <strong>Pantera</strong>, que moldaram sua forma de pensar ritmo, impacto e
  dinâmica.
</p>

<p>
  Diferente de uma abordagem puramente técnica, Taigo prioriza
  <strong>groove, intenção e peso</strong>, utilizando a bateria como elemento
  condutor da música, e não apenas como base rítmica.
  <br><br>
  Junto com Allison, idealizou a Economic Raped como um espaço onde fosse
  possível unir técnica, groove e emoção, criando uma linguagem que não
  excluísse nenhum desses elementos.
</p>

<p class="en">
  <strong>Taigo</strong>, drummer of Economic Raped, is from SP, Brazil.
  His style blends emo-driven emotion with heavy groove-oriented metal,
  influenced by bands like My Chemical Romance, Pierce The Veil, MSI, and
  Pantera.
</p>
`;

textBlock.innerHTML = bandText;

// BOTÃO DISCROGRAFIA
discographyBtn.onclick = () => {
  textBlock.style.display = "none";
  logoBtn.style.display = "none";
  discographyDiv.style.display = "block";
};

// LOGO VOLTAR AO NORMAL
logoBtn.onclick = () => {
  discographyDiv.style.display = "none";
  textBlock.style.display = "block";
  logoBtn.style.display = "block";
  document.body.className = "";
  allisonBtn.classList.remove("active");
  taigoBtn.classList.remove("active");
  tagline.textContent = "Metal Band";
  textBlock.innerHTML = bandText;
};

// ALLISON
allisonBtn.onclick = () => {
  discographyDiv.style.display = "none";
  textBlock.style.display = "block";
  document.body.className = "allison";
  allisonBtn.classList.add("active");
  taigoBtn.classList.remove("active");
  tagline.textContent = "Guitarra";
  textBlock.innerHTML = allisonText;
};

// TAIGO
taigoBtn.onclick = () => {
  discographyDiv.style.display = "none";
  textBlock.style.display = "block";
  document.body.className = "taigo";
  taigoBtn.classList.add("active");
  allisonBtn.classList.remove("active");
  tagline.textContent = "Bateria";
  textBlock.innerHTML = taigoText;
};
</script>

</body>
</html>
