<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Economic Raped</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #0d0d0d;
  --red: #e63946;
  --red-hover: #ff4d5a;
  --text: #eaeaea;
  --glow: rgba(230,57,70,0.8);
  --glow-strong: rgba(230,57,70,0.6);
}

/* ===== ALLISON ===== */
body.allison {
  --bg: #080000;
  --red: #8b0000;
  --red-hover: #8b0000;
  --glow: rgba(139,0,0,0.8);
  --glow-strong: rgba(139,0,0,0.6);
}

/* ===== TAIGO ===== */
body.taigo {
  --bg: #0a0014;
  --red: #7b2cbf;
  --red-hover: #9d4edd;
  --glow: rgba(123,44,191,0.8);
  --glow-strong: rgba(123,44,191,0.6);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  transition: background 0.8s ease;
}

/* ================= INTEGRANTES ================= */
.members {
  position: fixed;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 22px;
  line-height: 2;
  z-index: 10;
}

.members h2 {
  font-size: 26px;
  letter-spacing: 2px;
  margin-bottom: 20px;
  color: #fff;
}

.member {
  display: block;
  color: var(--red);
  cursor: pointer;
  transition: transform 0.25s ease, color 0.25s ease;
}

.member:hover {
  transform: scale(1.25);
  color: var(--red-hover);
}

.member.active {
  transform: scale(1.35);
  color: var(--red);
  pointer-events: none;
}

/* ================= CONTEÚDO ================= */
.content {
  max-width: 900px;
  margin: 0 auto;
  padding-top: 24px;
  padding-bottom: 300px;
}

/* ================= LOGO ================= */
.band-block {
  text-align: center;
  margin-bottom: 200px;
}

.band-block img {
  width: 420px;
  max-width: 92vw;
  display: block;
  margin: 0 auto;
  cursor: pointer;
  transition: filter 0.8s ease, transform 0.25s ease;
  filter:
    drop-shadow(0 0 10px var(--glow))
    drop-shadow(0 0 30px var(--glow-strong));
}

.band-block img:hover {
  transform: scale(1.05);
}

.tagline {
  margin-top: 14px;
  font-size: 14px;
  letter-spacing: 5px;
  color: var(--red);
  text-transform: uppercase;
  transition: color 0.6s ease;
}

.divider {
  width: 200px;
  height: 2px;
  background: var(--red);
  margin: 16px auto 0;
  transition: background 0.6s ease;
}

/* ================= TEXTO ================= */
.content p {
  font-size: 26px;
  line-height: 1.6;
  margin-bottom: 90px;
  text-align: center;
}

.content strong { color: var(--red); }
.content .en { font-size: 22px; color: #bbb; }
</style>
</head>

<body>

<div class="members">
  <h2>Integrantes</h2>
  <span class="member">Ana — Vocal</span>
  <span class="member" id="allisonBtn">Allison — Guitarra</span>
  <span class="member">Ciclano — Baixo</span>
  <span class="member" id="taigoBtn">Taigo — Bateria</span>
</div>

<div class="content">

  <div class="band-block">
    <img src="Logobanda.png" alt="Economic Raped Logo" id="logoBtn">
    <div class="tagline" id="tagline">Metal Band</div>
    <div class="divider"></div>
  </div>

  <div id="textBlock"></div>

</div>

<script>
const allisonBtn = document.getElementById("allisonBtn");
const taigoBtn = document.getElementById("taigoBtn");
const logoBtn = document.getElementById("logoBtn");
const textBlock = document.getElementById("textBlock");
const tagline = document.getElementById("tagline");

let activePage = "band";

/* ===== TEXTOS ===== */
const bandText = `
<p>
  <strong>Economic Raped</strong> é uma banda de metal fundada em
  <strong>Santos/SP</strong> por <strong>Allison</strong> e <strong>Taigo</strong>,
  nascida da necessidade de criar um ponto de encontro entre dois mundos que
  raramente coexistem.
  <br><br>
  A banda propõe uma fusão entre a intensidade emocional do <strong>Emo</strong>
  e a complexidade extrema do <strong>metal técnico</strong>, equilibrando
  precisão, agressividade e sentimento em composições densas e elaboradas.
  <br><br>
  A formação atual conta com <strong>Ana</strong> (vocal),
  <strong>Allison</strong> (guitarra),
  <strong>Ciclano</strong> (baixo) e
  <strong>Taigo</strong> (bateria).
</p>

<p class="en">
  <strong>Economic Raped</strong> is a metal band founded in Santos, Brazil, by
  <strong>Allison</strong> and <strong>Taigo</strong>, built around the idea of
  merging emo-driven emotion with the brutality and precision of
  highly technical metal.
</p>
`;

const allisonText = `
<p>
  <strong>Allison</strong>, guitarrista da Economic Raped, é natural da capital de
  São Paulo e desenvolveu sua identidade musical a partir do
  <strong>neoclassicismo</strong> e do <strong>death metal técnico</strong>.
  <br><br>
  Suas principais influências incluem <strong>Cacophony</strong>,
  <strong>First Fragment</strong> e <strong>Necrophagist</strong>, refletidas em uma
  abordagem que prioriza precisão extrema, complexidade harmônica e narrativa
  musical dentro dos solos.
  <br><br>
  A criação da banda ao lado de <strong>Taigo</strong> surgiu da percepção de que
  não existia um verdadeiro meio-termo entre a tecnicidade do metal extremo e a
  expressividade emocional presente no Emo.
</p>

<p class="en">
  <strong>Allison</strong>, guitarist of Economic Raped, is from SP, Brazil.
  His playing is shaped by neoclassical concepts and technical death metal,
  combining precision, complexity and emotional intent.
</p>
`;

const taigoText = `
<p>
  <strong>Taigo</strong>, baterista da Economic Raped, é natural de
  <strong>Santos/SP</strong> e constrói sua identidade rítmica a partir da fusão
  entre emoção, groove e agressividade.
  <br><br>
  Suas influências passam por <strong>My Chemical Romance</strong>,
  <strong>Pierce the Veil</strong>, <strong>MSI</strong> e pelo groove pesado e
  arrastado do <strong>Pantera</strong>, resultando em uma bateria que alterna
  entre intensidade emocional e peso rítmico.
  <br><br>
  Junto de <strong>Allison</strong>, Taigo idealizou a banda como uma ponte entre
  a expressividade do Emo e a sofisticação técnica do metal extremo.
</p>

<p class="en">
  <strong>Taigo</strong>, drummer of Economic Raped, is from SP, Brazil.
  His style blends emo-driven emotion with heavy groove influences,
  particularly inspired by Pantera.
</p>
`;

function resetState() {
  document.body.classList.remove("allison", "taigo");
  allisonBtn.classList.remove("active");
  taigoBtn.classList.remove("active");
  tagline.textContent = "Metal Band";
  textBlock.innerHTML = bandText;
  activePage = "band";
}

textBlock.innerHTML = bandText;

allisonBtn.onclick = () => {
  if (activePage === "allison") return resetState();
  resetState();
  document.body.classList.add("allison");
  allisonBtn.classList.add("active");
  tagline.textContent = "Guitarrista";
  textBlock.innerHTML = allisonText;
  activePage = "allison";
};

taigoBtn.onclick = () => {
  if (activePage === "taigo") return resetState();
  resetState();
  document.body.classList.add("taigo");
  taigoBtn.classList.add("active");
  tagline.textContent = "Baterista";
  textBlock.innerHTML = taigoText;
  activePage = "taigo";
};

logoBtn.onclick = resetState;
</script>

</body>
</html>
