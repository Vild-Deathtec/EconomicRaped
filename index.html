<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Economic Raped</title>

<!-- FAVICON (MESMA LOGO) -->
<link rel="icon" type="image/png" href="Logobanda.png">

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0d0d0d;
  --red: #e63946;
  --red-hover: #ff4d5a;
  --purple: #7a1fa2;
  --text: #eaeaea;
}

/* ===== MODO ALLISON ===== */
body.allison {
  --bg: #080000;
  --red: #8b0000;
  --red-hover: #8b0000;
}

/* ===== MODO TAIGO ===== */
body.taigo {
  --bg: #0b0012;
  --red: #7a1fa2;
  --red-hover: #7a1fa2;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  transition: background 0.8s ease;
}

/* ================= INTEGRANTES ================= */
.members {
  position: fixed;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 22px;
  line-height: 2;
  z-index: 10;
}

.members h2 {
  font-size: 26px;
  letter-spacing: 2px;
  margin-bottom: 20px;
  color: #fff;
}

.member {
  display: block;
  color: var(--red);
  cursor: pointer;
  transition: transform 0.25s ease, color 0.25s ease;
}

.member:hover {
  transform: scale(1.25);
  color: var(--red-hover);
}

.member.active {
  transform: scale(1.35);
  color: var(--red);
  pointer-events: none;
}

/* ================= CONTEÚDO ================= */
.content {
  max-width: 900px;
  margin: 0 auto;
  padding-top: 24px;
  padding-bottom: 300px;
}

/* ================= LOGO ================= */
.band-block {
  text-align: center;
  margin-bottom: 20px;
  cursor: pointer;
}

.band-block img {
  width: 420px;
  max-width: 92vw;
  display: block;
  margin: 0 auto;
  filter:
    drop-shadow(0 0 10px var(--red))
    drop-shadow(0 0 30px var(--red));
  transition: filter 0.6s ease;
}

.tagline {
  margin-top: 14px;
  font-size: 14px;
  letter-spacing: 5px;
  color: var(--red);
  text-transform: uppercase;
}

.divider {
  width: 200px;
  height: 2px;
  background: var(--red);
  margin: 16px auto 0;
}

/* ================= TEXTO ================= */
.content p {
  font-size: 26px;
  line-height: 1.6;
  margin-bottom: 90px;
  text-align: center;
}

.content strong {
  color: var(--red);
}

.content .en {
  font-size: 22px;
  color: #bbb;
}

/* ================= DISCOS ================= */
.discography {
  display: none;
  text-align: center;
  margin-top: 60px;
}

.discography img {
  width: 220px;
  max-width: 50vw;
  cursor: pointer;
  transition: filter 0.4s ease, transform 0.4s ease;
  filter: drop-shadow(0 0 10px var(--red))
          drop-shadow(0 0 30px var(--red));
}

.discography img:hover {
  transform: scale(1.1);
  filter: drop-shadow(0 0 20px var(--red))
          drop-shadow(0 0 40px var(--red));
}

/* ================= BOTÃO DISCOS ================= */
#discographyBtn {
  display: inline-block;
  margin-top: 16px;
  padding: 8px 20px;
  background: transparent;
  border: 2px solid var(--red);
  color: var(--red);
  cursor: pointer;
  font-size: 16px;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

#discographyBtn:hover {
  background: var(--red);
  color: #fff;
  box-shadow: 0 0 20px var(--red), 0 0 40px var(--red);
}

/* ================= PLAYER VISUAL ================= */
.now-playing {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--red);
  padding: 14px 18px;
  width: 280px;
  font-size: 14px;
  letter-spacing: 1px;
  z-index: 999;
}

.now-playing span {
  display: block;
  color: var(--red);
  font-size: 11px;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.now-playing strong {
  color: #fff;
  font-weight: normal;
}

/* ===== RODAPÉ ===== */
.footer {
  text-align: center;
  padding: 40px 20px;
  color: var(--text);
  font-size: 18px;
  background: #111;
  margin-top: 50px;
}

.footer a {
  color: var(--red);
  text-decoration: none;
  transition: color 0.3s ease;
}

.footer a:hover {
  color: var(--red-hover);
}

.footer img {
  width: 40px;
  margin-left: 10px;
  cursor: pointer;
  filter: drop-shadow(0 0 10px var(--red))
          drop-shadow(0 0 30px var(--red));
  transition: filter 0.4s ease, transform 0.4s ease;
}

.footer img:hover {
  transform: scale(1.2);
  filter: drop-shadow(0 0 20px var(--red))
          drop-shadow(0 0 40px var(--red));
}
</style>
</head>

<body>

<!-- INTEGRANTES -->
<div class="members">
  <h2>Integrantes</h2>
  <span class="member">Ana — Vocal</span>
  <span class="member" id="allisonBtn">Allison — Guitarra</span>
  <span class="member">Ciclano — Baixo</span>
  <span class="member" id="taigoBtn">Taigo — Bateria</span>
</div>

<!-- CONTEÚDO -->
<div class="content">

  <!-- LOGO -->
  <div class="band-block" id="logoBtn">
    <img src="Logobanda.png" alt="Economic Raped Logo">
    <div class="tagline" id="tagline">Metal Band</div>
    <div class="divider"></div>

    <!-- BOTÃO DISCOS -->
    <button id="discographyBtn">Discografia</button>
  </div>

  <!-- TEXTO -->
  <div id="textBlock"></div>

  <!-- DISCOS -->
  <div class="discography" id="discographyBlock">
    <a href="https://www.spotify.com" target="_blank">
      <img src="CapaAlbum.jpg" alt="Capa do Album">
    </a>
  </div>

</div>

<!-- PLAYER VISUAL -->
<div class="now-playing">
  <span>Tocando agora</span>
  <strong>Economic Raped — No One Is Ever Going to Want Me</strong>
</div>

<!-- RODAPÉ COM EMAIL E INSTAGRAM -->
<footer class="footer">
  <p>Contato: <a href="mailto:EconomicRapedband@gmail.com">EconomicRapedband@gmail.com</a>
  <a href="https://www.instagram.com/economicraped/" target="_blank">
    <img src="Instagramicon.png" alt="Instagram">
  </a>
  </p>
</footer>

<script>
const allisonBtn = document.getElementById("allisonBtn");
const taigoBtn = document.getElementById("taigoBtn");
const textBlock = document.getElementById("textBlock");
const tagline = document.getElementById("tagline");
const logoBtn = document.getElementById("logoBtn");
const discographyBtn = document.getElementById("discographyBtn");
const discographyBlock = document.getElementById("discographyBlock");

const bandText = `
<p>
 <strong>Economic Raped</strong> é uma banda de metal fundada em Santos/SP por
  <strong>Allison</strong> e <strong>Taigo</strong>, criada a partir da percepção de
  que não existia um espaço claro onde a <strong>técnica extrema</strong> e a
  <strong>complexidade musical</strong> pudessem coexistir com a
  <strong>expressividade emocional</strong> do Emo.
</p>

<p>
  Musicalmente, a banda explora estruturas complexas, harmonias avançadas,
  grooves pesados e variações rítmicas, sem abrir mão de identidade,
  atmosfera e impacto emocional.
</p>

<p class="en">
  <strong>Economic Raped</strong> is a metal band founded in Santos, Brazil, by
  <strong>Allison</strong> and <strong>Taigo</strong>.
</p>
`;

const allisonText = `
<p>
  <strong>Allison</strong>, guitarrista da Economic Raped, é natural da capital de
  São Paulo e desenvolveu sua identidade musical a partir do
  <strong>neoclassicismo</strong> e do <strong>death metal técnico</strong>.
</p>
<p class="en">
  <strong>Allison</strong>, guitarist of Economic Raped, is from SP, Brazil.
</p>
`;

const taigoText = `
<p>
  <strong>Taigo</strong>, baterista da Economic Raped, é natural de Santos/SP e
  construiu sua identidade musical a partir de uma combinação pouco comum.
</p>
<p class="en">
  <strong>Taigo</strong>, drummer of Economic Raped, is from SP, Brazil.
</p>
`;

textBlock.innerHTML = bandText;

// CLICK INTEGRANTES
allisonBtn.onclick = () => {
  document.body.className = "allison";
  allisonBtn.classList.add("active");
  taigoBtn.classList.remove("active");
  tagline.textContent = "Guitarra";
  textBlock.style.display = "block";
  discographyBlock.style.display = "none";
  textBlock.innerHTML = allisonText;
};

taigoBtn.onclick = () => {
  document.body.className = "taigo";
  taigoBtn.classList.add("active");
  allisonBtn.classList.remove("active");
  tagline.textContent = "Bateria";
  textBlock.style.display = "block";
  discographyBlock.style.display = "none";
  textBlock.innerHTML = taigoText;
};

// CLICK LOGO
logoBtn.onclick = () => {
  document.body.className = "";
  allisonBtn.classList.remove("active");
  taigoBtn.classList.remove("active");
  tagline.textContent = "Metal Band";
  textBlock.style.display = "block";
  discographyBlock.style.display = "none";
  textBlock.innerHTML = bandText;
};

// CLICK DISCOS
discographyBtn.onclick = () => {
  textBlock.style.display = "none";
  discographyBlock.style.display = "block";
  // desinchar integrantes
  allisonBtn.classList.remove("active");
  taigoBtn.classList.remove("active");
};
</script>

</body>
</html>
