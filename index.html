<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Economic Raped</title>

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: #eaeaea;
      font-family: Arial, sans-serif;
      height: 100vh;
    }

    /* Integrantes - esquerda meio */
    .members {
      position: absolute;
      left: 60px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 23px;
      line-height: 2;
    }

    .members h2 {
      font-size: 26px;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .member {
      display: block;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .member:hover {
      transform: scale(1.15);
      color: #e63946;
    }

    /* Nome da banda - mais pra cima */
    .band-name {
      position: absolute;
      left: 50%;
      top: 10%; /* MAIS PRA CIMA */
      transform: translateX(-50%);
      text-align: center;
    }

    .economic {
      font-size: 96px;
      font-weight: 300;
      letter-spacing: 6px;
      display: block;
    }

    .raped {
      font-size: 128px;
      font-weight: 900;
      letter-spacing: 8px;
      margin-top: -12px;
      display: block;
    }

    .tagline {
      font-size: 14px;
      letter-spacing: 4px;
      margin-top: 10px;
      color: #999;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="members">
    <h2>Integrantes</h2>
    <span class="member">Ana — Vocal</span>
    <span class="member">Allison — Guitarra</span>
    <span class="member">Ciclano — Baixo</span>
    <span class="member">Taigo — Bateria</span>
  </div>

  <div class="band-name">
    <span class="economic">ECONOMIC</span>
    <span class="raped">RAPED</span>
    <div class="tagline">Metal Band</div>
  </div>

</body>
</html>
